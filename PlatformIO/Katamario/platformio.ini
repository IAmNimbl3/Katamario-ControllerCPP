; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcu-32s

[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
lib_deps = electroniccats/MPU6050@^1.4.5
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
build_src_filter = +<main.cpp>

; Original USB check, selectable in Project Tasks.
[env:usb-smoke]
extends = env:nodemcu-32s
build_src_filter = +<usb_smoke.cpp>

; Temporary raw sensor diagnosis; does not drive movement or Bluetooth.
[env:sensor-diagnostic]
extends = env:nodemcu-32s
build_src_filter = +<sensor_diagnostic.cpp>

; Bench-only full I2C address scan. Restore nodemcu-32s after diagnosis.
[env:i2c-scanner]
extends = env:nodemcu-32s
build_src_filter = +<i2c_scanner.cpp>
